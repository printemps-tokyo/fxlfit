name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/fxlfit"
          tar -czf "fxlfit-${{ matrix.target }}.tar.gz" -C "$(dirname "$bin")" fxlfit
      # Release integrity: publish a checksum next to every artifact so
      # consumers can verify what they downloaded (OSPS-BR-06.01).
      - name: Checksums
        shell: bash
        run: |
          shasum -a 256 "fxlfit-${{ matrix.target }}.tar.gz" \
            > "fxlfit-${{ matrix.target }}.tar.gz.sha256"
      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            fxlfit-${{ matrix.target }}.tar.gz
            fxlfit-${{ matrix.target }}.tar.gz.sha256
          generate_release_notes: true
